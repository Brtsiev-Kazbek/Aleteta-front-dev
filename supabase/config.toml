# Конфигурация локального стека Supabase.
#
# Файл описывает то же, что включено в облачном проекте, поэтому переезд на
# self-hosted сводится к запуску того же стека на своём сервере: набор служб и
# их настройки уже зафиксированы здесь, а не в веб-панели.

project_id = "aleteya"

[api]
enabled = true
port = 54321
# Схема `app` наружу не публикуется: в ней живут вспомогательные функции,
# доступные только политикам и триггерам.
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
# Локальная почта: письма подтверждения и приглашения видно в браузере,
# настоящий SMTP на этом этапе не нужен.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Локально подтверждение почты выключено, иначе каждый тестовый вход требует
# похода в почтовый ящик. В облаке включаем.
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
